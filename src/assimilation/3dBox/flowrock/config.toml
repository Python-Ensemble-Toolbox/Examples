# ES on the large 3D box (60x60x5) with seismic data: estimate the log-permeability from
# well rates and time-lapse bulk impedance, computed by a rock-physics model

[ensemble]
    ne = 64                     # ensemble size
    seed = 10                   # random seed, makes the run reproducible
    state = "permx"             # the estimated field: log-permeability

    [ensemble.prior_permx]      # Gaussian prior of the field
        mean = "priormean.npz"  # prior mean, one value per cell (4.0)
        var = 1.0               # prior variance
        vario = "sph"           # spherical variogram ...
        range = 10.0            # ... with a correlation length of 10 cells
        aniso = 1.0             # no anisotropy
        angle = 0.0             # no rotation
        grid = [60, 60, 5]      # grid size

[dataassim]
    scheme = "es"               # ensemble smoother: one update with all the data
    analysis = "approx"         # the standard ensemble update
    energy = 98.0               # truncation energy of the SVD [%]
    obsname = "days"            # name of the data index
    data = "data.csv"           # observations, from ../make_data.py
    datavar = "var.csv"         # observation variances
    savefolder = "results"      # folder for the results
    savedata = ["ensemble_misfit"]  # saved before and after the update, as results/assimilation_result_<step>.npz

    [dataassim.compress]        # wavelet compression of the seismic data
        compress_data = "bulkimp"       # the data type to compress
        dim = [60, 60, 5]               # grid size of a vintage
        mask = ["actnum.npz", "actnum.npz"]   # active cells of each vintage (all)
        level = 1                       # wavelet decomposition level ...
        wname = "db2"                   # ... with Daubechies-2 wavelets
        threshold_rule = "universal"    # keep the coefficients above the universal threshold ...
        th_mult = 10000.0               # ... times this
        use_hard_th = true              # hard thresholding
        keep_ca = false                 # drop the approximation coefficients
        inactive_value = 0.0            # value outside the mask
        order = "F"                     # flatten order of a vintage
        min_noise = [1e-9, 1e-9]        # noise floor of each vintage

[simulator]
    runfile = "RUNFILE"         # simulator input template: RUNFILE.mako
    parallel = 8                # simulations run at the same time
    startdate = "1/1/2022"      # start of the simulation (day/month/year)
    reporttype = "days"         # report points are days since the start ...
    reportpoint = [400, 800, 1200, 1600, 2000, 2400, 2800, 3200, 3600, 4000]   # ... every 400 days
    datatype = ["WOPR:PRO1", "WWPR:PRO1", "WOPR:PRO2", "WWPR:PRO2",
                "WOPR:PRO3", "WWPR:PRO3", "WWIR:INJ1", "bulkimp"]   # well rates, and bulk impedance

    # rock-physics model: bulk impedance at each vintage, minus at the baseline
    pem = [["model", "standardrp elasticproperties"],   # the rock-physics model
           ["baseline", 0.0],                           # baseline survey [days]
           ["vintage", [2000.0, 4000.0]],               # monitor surveys [days]
           ["overburden", "overburden.npz"],            # overburden pressure
           ["phases", ["wat", "gas", "oil"]]]           # fluid phases
