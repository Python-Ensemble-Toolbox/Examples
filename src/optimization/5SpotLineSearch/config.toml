# BFGS line search on a 2D five-spot field: find the yearly water-injection rates
# of the four injectors that maximize the net present value (NPV)

[ensemble]
    ne = 20                     # perturbations per gradient estimate
    seed = 10081997             # random seed, makes the run reproducible
    save_prior = false          # don't write the initial ensemble to prior_ensemble.npz
    natural_gradient = false    # return the plain gradient, as BFGS expects

    [ensemble.controls]
        # one rate per year for eight years [Sm3/day]: starting point, perturbation std and bounds
        rate_inj1 = { mean = [200, 200, 200, 200, 200, 200, 200, 200], std = "5%", limits = [0, 500] }
        rate_inj2 = { mean = [200, 200, 200, 200, 200, 200, 200, 200], std = "5%", limits = [0, 500] }
        rate_inj3 = { mean = [200, 200, 200, 200, 200, 200, 200, 200], std = "5%", limits = [0, 500] }
        rate_inj4 = { mean = [200, 200, 200, 200, 200, 200, 200, 200], std = "5%", limits = [0, 500] }

[optim]
    transform = true            # optimise in the unit cube [0, 1]^n
    maxiter = 20                # maximum number of iterations
    step_size_adapt = 2         # first trial step of each line search: previous step scaled by the change in slope
    saveit = true               # save the result of every iteration ...
    savefolder = "results"      # ... as results/optimize_result_<iteration>.npz

[simulator]
    runfile = "5SPOT"           # simulator input template: 5SPOT.mako
    parallel = 5                # simulations run at the same time
    datatype = ["FOPT", "FGPT", "FWPT", "FWIT"]   # field oil, gas and water production, water injection
    reporttype = "dates"        # report points are dates ...

    [simulator.reportpoint]     # ... on the first of every month
        start = "2000-02-01"
        end = "2008-01-01"
        freq = "MS"

    [simulator.npv_const]       # economic constants for the NPV
        wop = 400               # oil price [USD/Sm3]
        wgp = 0.4               # gas price [USD/Sm3]
        wwp = 20                # cost of water disposal [USD/Sm3]
        wwi = 10                # cost of water injection [USD/Sm3]
        disc = 0.08             # yearly discount rate
        obj_scaling = -1e9      # NPV is divided by this: negative (to minimize) and in billion USD
