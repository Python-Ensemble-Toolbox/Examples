# EnOpt on the Rosenbrock function, using an ensemble estimate of the gradient

[ensemble]
    ne = 10                 # perturbations per gradient estimate
    seed = 101122           # random seed, makes the run reproducible
    save_prior = false      # don't write the initial ensemble to prior_ensemble.npz

    [ensemble.controls]
        # control vector: starting point, perturbation variance and bounds
        x = { mean = [-2.0, -2.0], var = 1.0e-5, limits = [-2.0, 2.0] }

[optim]
    optimizer = "GD"        # update rule: gradient descent
    transform = true        # optimise in the unit cube [0, 1]^n
    maxiter = 1000          # maximum number of iterations
    tol = 1e-10             # smallest decrease of the objective that counts as progress
    alpha = 0.25            # step size
    alpha_maxiter = 20      # step-size halvings per iteration
    resample = 10           # new gradient estimates per iteration if no step improves
